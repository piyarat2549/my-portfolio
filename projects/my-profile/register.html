<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครชมรมบาสเกตบอล | ปิยวัฒน์ ไชยพิเดช</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>สมัครชมรมบาสเกตบอล</h1>
    <p class="tagline">มาซ้อม มาแข่ง มาสนุกไปด้วยกัน</p>
  </header>

  <nav>
    <a href="index.html">โปรไฟล์</a>
    <a href="register.html" class="active">สมัครชมรม</a>
  </nav>

  <main>
    <section>
      <h2>แบบฟอร์มสมัครสมาชิก</h2>
      <p>ช่องที่มีเครื่องหมาย <span class="required-mark">*</span> ต้องกรอก</p>

      <form action="register.html" method="get" class="club-form">
        <div class="field">
          <label for="fullname">ชื่อ-นามสกุล <span class="required-mark">*</span></label>
          <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="field">
          <label for="email">อีเมล <span class="required-mark">*</span></label>
          <input type="email" id="email" name="email" required>
        </div>

        <fieldset class="field">
          <legend>ระดับชั้น <span class="required-mark">*</span></legend>
          <input type="radio" id="grade4" name="grade" value="m4" required>
          <label for="grade4">ม.4</label>
          <input type="radio" id="grade5" name="grade" value="m5">
          <label for="grade5">ม.5</label>
          <input type="radio" id="grade6" name="grade" value="m6">
          <label for="grade6">ม.6</label>
        </fieldset>

        <div class="field">
          <label for="position">ตำแหน่งที่อยากเล่น</label>
          <select id="position" name="position">
            <option value="point-guard">พอยต์การ์ด</option>
            <option value="shooting-guard">ชู้ตติ้งการ์ด</option>
            <option value="small-forward">สมอลฟอร์เวิร์ด</option>
            <option value="power-forward">พาวเวอร์ฟอร์เวิร์ด</option>
            <option value="center">เซ็นเตอร์</option>
          </select>
        </div>

        <div class="field">
          <label for="reason">เหตุผลที่อยากเข้าชมรม</label>
          <textarea id="reason" name="reason" rows="4"></textarea>
        </div>

        <button type="submit">ส่งใบสมัคร</button>
      </form>
    </section>
  </main>

</body>
</html>
